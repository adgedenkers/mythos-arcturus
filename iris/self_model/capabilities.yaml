    biological_system: "iris-sensory"
    depends_on: []
    telegram_commands:
      - "/weather"

# ═══════════════════════════════════════════════════════════════
# SELF-AWARENESS QUERIES
# ═══════════════════════════════════════════════════════════════
# These are queries Iris can run against herself.
# Used by /iris_reflect and the Grid introspection layers.

self_queries:
  what_can_i_do: |
    // "What can I do?"
    // Returns all capabilities from the graph
    MATCH (f:IntegrityFile {status: 'active'})
    WITH count(f) AS total_files
    MATCH (fn:IntegrityFunction)
    WITH total_files, count(fn) AS total_functions
    MATCH (s:IntegrityService)
    WITH total_files, total_functions, count(s) AS total_services
    MATCH (t:IntegrityTable)
    RETURN total_files, total_functions, total_services, count(t) AS total_tables

  whats_broken: |
    // "What's broken right now?"
    MATCH (s:IntegrityService)
    WHERE s.status <> 'active'
    RETURN s.name AS down_service, s.status

  what_changed_today: |
    // "What changed in the last 24 hours?"
    MATCH (f:IntegrityFile)
    WHERE f.hash_changed = true
    RETURN f.path, f.filename, f.last_modified
    ORDER BY f.last_modified DESC
    LIMIT 20

  how_big_am_i: |
    // "How big am I?"
    MATCH (f:IntegrityFile {status: 'active'})
    WITH count(f) AS files, sum(f.size_bytes) AS total_bytes
    MATCH (fn:IntegrityFunction)
    WITH files, total_bytes, count(fn) AS functions
    MATCH (s:IntegrityService)
    WITH files, total_bytes, functions, count(s) AS services
    MATCH (t:IntegrityTable)
    WITH files, total_bytes, functions, services, count(t) AS tables
    MATCH (c:IntegrityColumn)
    RETURN files, total_bytes, functions, services, tables, count(c) AS columns

  whats_undocumented: |
    // "What's undocumented?"
    MATCH (fn:IntegrityFunction)
    WHERE fn.docstring IS NULL OR fn.docstring = ''
    RETURN fn.name, fn.file_path
    ORDER BY fn.file_path
    LIMIT 30

  what_depends_on_postgres: |
    // "What depends on PostgreSQL?"
    MATCH (t:IntegrityTable)-[:HAS_COLUMN]->(c:IntegrityColumn)
    WITH count(DISTINCT t) AS tables, count(c) AS columns
    MATCH (s:IntegrityService)
    WHERE s.name = 'postgresql'
    RETURN s.name, s.status, tables, columns

  largest_files: |
    // "What are my largest files?"
    MATCH (f:IntegrityFile {status: 'active'})
    RETURN f.path, f.size_bytes, f.extension
    ORDER BY f.size_bytes DESC
    LIMIT 15

  most_complex_files: |
    // "Which files have the most functions?"
    MATCH (f:IntegrityFile {status: 'active'})-[:CONTAINS]->(fn:IntegrityFunction)
    RETURN f.path, count(fn) AS function_count
    ORDER BY function_count DESC
    LIMIT 15
