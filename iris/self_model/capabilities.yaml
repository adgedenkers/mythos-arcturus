    depends_on: ["mythos-transcription-worker", "mythos-voice-watcher", "redis-server", "postgresql"]
    telegram_commands:
      - "/voice"
    status_query: |
      MATCH (s:IntegrityService {name: 'mythos-transcription-worker'})
      RETURN s.name, s.status

  memory:
    description: "Persistent conversation memory with context injection"
    biological_system: "iris-skeletal"
    depends_on: ["postgresql", "redis-server"]
    telegram_commands: []

  self_inspection:
    description: "Query own architecture, check own health, understand own capabilities"
    biological_system: "iris-immune"
    depends_on: ["neo4j"]
    telegram_commands:
      - "/integrity"
      - "/iris_reflect"
    status_query: |
      MATCH (f:IntegrityFile {status: 'active'})
      WITH count(f) AS files
      MATCH (fn:IntegrityFunction)
      WITH files, count(fn) AS functions
      MATCH (s:IntegrityService)
      WITH files, functions, count(s) AS services
      MATCH (t:IntegrityTable)
      RETURN files, functions, services, count(t) AS tables

  patch_awareness:
    description: "Know what patches have been deployed, what changed, system version"
    biological_system: "iris-reproductive"
    depends_on: ["mythos-patch-monitor"]
    telegram_commands:
