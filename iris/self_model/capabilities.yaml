    description: "Self-knowledge and anomaly detection — file/function/service/table scanning"
    services: []
    key_files:
      - "/opt/mythos/integrity/__main__.py"
      - "/opt/mythos/integrity/file_scanner.py"
      - "/opt/mythos/integrity/function_extractor.py"
