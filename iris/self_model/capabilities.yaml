      primary: "qwen2.5:32b"
      deep: "qwen2:72b"
      extractor: "qwen2.5:7b"
    depends_on: ["ollama", "postgresql", "redis-server"]
    telegram_commands: []
    status_query: |
      MATCH (s:IntegrityService {name: 'mythos-bot'})
