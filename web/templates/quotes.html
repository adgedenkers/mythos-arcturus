<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythos — Quotes</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root {
  --bg:#050810; --bg-card:rgba(12,17,30,0.85); --bg-hover:rgba(26,35,50,0.9);
  --border:rgba(30,42,65,0.6); --border-glow:rgba(6,182,212,0.15);
  --text:#e2e8f0; --dim:#64748b; --muted:#334155;
  --cyan:#06b6d4; --gold:#d4a574; --purple:#8b5cf6; --green:#22c55e;
  --red:#ef4444; --amber:#f59e0b; --rose:#f472b6;
  --cyan-bg:rgba(6,182,212,0.08); --gold-bg:rgba(212,165,116,0.08);
  --purple-bg:rgba(139,92,246,0.08); --rose-bg:rgba(244,114,182,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;overflow:hidden;height:100vh;display:flex;flex-direction:column;}
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bg-radial{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(212,165,116,0.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,rgba(244,114,182,0.03) 0%,transparent 50%);}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(212,165,116,0.012) 1px,transparent 1px),linear-gradient(90deg,rgba(212,165,116,0.012) 1px,transparent 1px);background-size:80px 80px;}
.topbar{position:relative;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(5,8,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar-logo{font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:4px;color:var(--gold);}
.topbar-nav{display:flex;gap:2px;}
.topbar-nav a{padding:7px 16px;border-radius:6px;color:var(--dim);text-decoration:none;font-size:13px;font-weight:500;transition:all .2s;}
.topbar-nav a:hover{color:var(--text);background:rgba(255,255,255,0.04);}
.topbar-nav a.active{color:var(--gold);background:var(--gold-bg);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.topbar-user{font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace;}
.topbar-logout{padding:5px 12px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--muted);font-size:11px;text-decoration:none;transition:all .2s;}
.topbar-logout:hover{border-color:var(--red);color:var(--red);}
.app-body{display:flex;flex:1;overflow:hidden;position:relative;z-index:1;}
/* ── Left Panel ── */
.quote-list-panel{width:420px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.search-bar{padding:16px;border-bottom:1px solid var(--border);}
.search-input{width:100%;padding:10px 14px 10px 36px;background:rgba(5,8,16,0.6);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--gold);}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.filter-row{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.filter-tab{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid transparent;color:var(--dim);background:transparent;}
.filter-tab:hover{color:var(--text);background:rgba(255,255,255,0.04);}
.filter-tab.active{border-color:var(--gold);color:var(--gold);background:var(--gold-bg);}
.filter-tab .count{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:0.6;margin-left:3px;}
.quote-scroll{flex:1;overflow-y:auto;padding:8px;}
.quote-item{padding:14px;border-radius:8px;cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:4px;}
.quote-item:hover{background:var(--bg-hover);border-color:var(--border);}
.quote-item.active{background:var(--gold-bg);border-color:rgba(212,165,116,0.3);}
.quote-text{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;line-height:1.5;margin-bottom:6px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.quote-item.active .quote-text{color:var(--gold);}
.quote-meta{display:flex;align-items:center;gap:8px;}
.quote-speaker{font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:0.5px;text-transform:uppercase;padding:2px 6px;border-radius:3px;color:var(--rose);background:var(--rose-bg);}
.quote-id{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.quote-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;}
.quote-tag-pill{font-size:9px;padding:1px 6px;border-radius:3px;color:var(--cyan);background:var(--cyan-bg);font-family:'JetBrains Mono',monospace;}
.quote-count{font-size:11px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--border);font-family:'JetBrains Mono',monospace;text-align:center;}
/* ── Right Panel ── */
.detail-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.detail-empty .icon{font-size:48px;opacity:0.15;}
.detail-empty .msg{font-size:14px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:1px;}
.detail-content{flex:1;overflow-y:auto;padding:0;animation:fadeIn .25s ease-out;}
.detail-header{padding:32px 32px 0;border-bottom:1px solid var(--border);padding-bottom:24px;}
.detail-quote-text{font-family:'Cormorant Garamond',serif;font-size:26px;font-style:italic;line-height:1.6;color:var(--gold);margin-bottom:12px;max-width:700px;}
.detail-quote-text::before{content:'\201C';font-size:40px;color:rgba(212,165,116,0.3);line-height:0;vertical-align:-12px;margin-right:4px;}
.detail-badges{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.detail-speaker{font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:0.5px;text-transform:uppercase;padding:3px 10px;border-radius:4px;color:var(--rose);background:var(--rose-bg);}
.detail-qid{font-size:11px;color:var(--dim);padding:3px 8px;border:1px solid var(--border);border-radius:4px;font-family:'JetBrains Mono',monospace;}
.detail-tag{font-size:11px;color:var(--cyan);padding:3px 8px;border:1px solid rgba(6,182,212,0.2);border-radius:4px;background:var(--cyan-bg);font-family:'JetBrains Mono',monospace;}
.detail-section{padding:24px 32px;}
.section-heading{font-family:'Cinzel',serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.section-text{font-size:15px;line-height:1.7;color:var(--text);max-width:700px;}
.interpretation-text{font-size:15px;line-height:1.7;color:var(--purple);max-width:700px;padding-left:16px;border-left:2px solid rgba(139,92,246,0.3);}
.rel-chips{display:flex;flex-wrap:wrap;gap:6px;}
.rel-chip{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--bg-card);}
.rel-chip:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-bg);}
.graph-section{border-top:1px solid var(--border);padding:24px 32px 0;}
.graph-container{width:100%;height:350px;background:rgba(5,8,16,0.4);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px;}
.graph-container svg{width:100%;height:100%;}
.graph-container .node circle{cursor:pointer;transition:r .15s;}
.graph-container .node text{font-family:'DM Sans',sans-serif;font-size:11px;fill:var(--text);pointer-events:none;}
.graph-container .link{stroke:var(--border);stroke-opacity:0.5;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.quote-list-panel{width:300px;}}
@media(max-width:600px){.app-body{flex-direction:column;}.quote-list-panel{width:100%;max-height:40vh;}}
</style>
</head>
<body>
<div class="bg-layer"><div class="bg-radial"></div><div class="bg-grid"></div></div>
<div class="topbar">
  <div class="topbar-logo">MYTHOS</div>
  <nav class="topbar-nav">
    <a href="/app/">Home</a>
    <a href="/app/finance/">Finance</a>
    <a href="/app/people/">People</a>
    <a href="/app/ontology/">Ontology</a>
    <a href="/app/quotes/" class="active">Quotes</a>
    <a href="/app/shopping/">Shopping</a>
    <a href="/app/system/">System</a>
    <a href="/app/iris/">Iris</a>
    <a href="/app/sessions/">Sessions</a>
    <a href="/app/registry/">Registry</a>
  </nav>
  <div class="topbar-right">
    <span class="topbar-user" id="user-name"></span>
    <a href="/auth/logout" class="topbar-logout">logout</a>
  </div>
</div>
<div class="app-body">
  <div class="quote-list-panel">
    <div class="search-bar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" class="search-input" id="search" placeholder="Search quotes, tags, interpretations…" autocomplete="off">
      </div>
    </div>
    <div class="filter-row" id="speaker-tabs"></div>
    <div class="filter-row" id="tag-tabs"></div>
    <div class="quote-scroll" id="quote-list"></div>
    <div class="quote-count" id="quote-count"></div>
  </div>
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty">
      <div class="icon">✦</div>
      <div class="msg">Select a quote to explore</div>
    </div>
  </div>
</div>
<script>
let allQuotes=[], speakers=[], tags=[], activeSpeaker=null, activeTag=null, activeQid=null;
fetch('/auth/me').then(r=>{if(!r.ok)throw 'a';return r.json()}).then(d=>{
  document.getElementById('user-name').textContent=d.name||d.email;
}).catch(()=>{window.location.href='/app/login'});

async function loadQuotes(){
  const res=await fetch('/api/quotes/');const data=await res.json();allQuotes=data.quotes;
  const sp=await fetch('/api/quotes/speakers');speakers=(await sp.json()).speakers;
  const tg=await fetch('/api/quotes/tags');tags=(await tg.json()).tags;
  renderSpeakerTabs();renderTagTabs();renderList();
}
function renderSpeakerTabs(){
  const el=document.getElementById('speaker-tabs');
  let h=`<div class="filter-tab ${!activeSpeaker?'active':''}" onclick="filterSpeaker(null)">All<span class="count">${allQuotes.length}</span></div>`;
  speakers.forEach(s=>{h+=`<div class="filter-tab ${activeSpeaker===s.speaker?'active':''}" onclick="filterSpeaker('${s.speaker}')">${s.speaker}<span class="count">${s.count}</span></div>`;});
  el.innerHTML=h;
}
function renderTagTabs(){
  const el=document.getElementById('tag-tabs');
  let h=tags.slice(0,8).map(t=>`<div class="filter-tab ${activeTag===t.tag?'active':''}" onclick="filterTag('${t.tag}')">${t.tag}<span class="count">${t.count}</span></div>`).join('');
  if(activeTag&&!tags.slice(0,8).find(t=>t.tag===activeTag))h+=`<div class="filter-tab active">${activeTag}</div>`;
  el.innerHTML=h;
}
function filterSpeaker(s){activeSpeaker=s;renderSpeakerTabs();renderList();}
function filterTag(t){activeTag=activeTag===t?null:t;renderTagTabs();renderList();}
function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  return allQuotes.filter(item=>{
    if(activeSpeaker&&item.speaker!==activeSpeaker)return false;
    if(activeTag&&!(item.tags||[]).includes(activeTag))return false;
    if(q){const h=[item.text,item.description,item.interpretation,...(item.tags||[])].join(' ').toLowerCase();return h.includes(q);}
    return true;
  });
}
function renderList(){
  const items=getFiltered();const el=document.getElementById('quote-list');
  el.innerHTML=items.map(q=>{
    const short=q.text.length>80?q.text.slice(0,80)+'…':q.text;
    const tagHtml=(q.tags||[]).slice(0,3).map(t=>`<span class="quote-tag-pill">${t}</span>`).join('');
    return `<div class="quote-item ${activeQid===q.quote_id?'active':''}" onclick="selectQuote('${q.quote_id}')">
      <div class="quote-text">${short}</div>
      <div class="quote-meta"><span class="quote-speaker">${q.speaker}</span><span class="quote-id">${q.quote_id}</span></div>
      ${tagHtml?`<div class="quote-tags">${tagHtml}</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('quote-count').textContent=`${items.length} quote${items.length!==1?'s':''}`;
}
async function selectQuote(qid){
  activeQid=qid;renderList();
  const res=await fetch(`/api/quotes/${encodeURIComponent(qid)}`);const q=await res.json();
  renderDetail(q);
}
function renderDetail(q){
  const panel=document.getElementById('detail-panel');
  const tagHtml=(q.tags||[]).map(t=>`<span class="detail-tag">${t}</span>`).join('');
  const hasRels=(q.related_to||[]).length+(q.related_from||[]).length>0;
  let sections='';
  if(q.description)sections+=`<div class="detail-section"><div class="section-heading">Description</div><div class="section-text">${q.description}</div></div>`;
  if(q.interpretation)sections+=`<div class="detail-section"><div class="section-heading">Interpretation</div><div class="interpretation-text">${q.interpretation}</div></div>`;
  if(q.context)sections+=`<div class="detail-section"><div class="section-heading">Context</div><div class="section-text">${q.context}</div></div>`;
  if(hasRels){
    const chips=[...(q.related_to||[]),...(q.related_from||[])].map(r=>
      `<div class="rel-chip">${r.name}<span style="font-size:9px;margin-left:5px;opacity:0.5">${r.label||r.type}</span></div>`
    ).join('');
    sections+=`<div class="detail-section"><div class="section-heading">Connections</div><div class="rel-chips">${chips}</div></div>`;
  }
  panel.innerHTML=`<div class="detail-content">
    <div class="detail-header">
      <div class="detail-quote-text">${q.text}</div>
      <div class="detail-badges">
        <span class="detail-speaker">${q.speaker}</span>
        <span class="detail-qid">${q.quote_id}</span>
        ${tagHtml}
        ${q.date_spoken?`<span class="detail-qid">${q.date_spoken}</span>`:''}
      </div>
    </div>
    ${sections}
  </div>`;
}
document.getElementById('search').addEventListener('input',()=>{renderList();});
loadQuotes();
</script>
</body>
</html>
