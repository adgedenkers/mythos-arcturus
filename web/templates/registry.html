<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythos — The Registry</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--bg-card:rgba(12,17,30,0.85);--border:rgba(30,42,65,0.6);--text:#e2e8f0;--dim:#64748b;--muted:#334155;--cyan:#06b6d4;--gold:#d4a574;--purple:#8b5cf6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(5,8,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.topbar-logo{font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:4px;color:var(--gold)}
.topbar-nav{display:flex;gap:2px}.topbar-nav a{padding:7px 16px;border-radius:6px;color:var(--dim);text-decoration:none;font-size:13px;font-weight:500;transition:all 0.2s}.topbar-nav a:hover{color:var(--text);background:rgba(255,255,255,0.04)}.topbar-nav a.active{color:var(--cyan);background:rgba(6,182,212,0.08)}
.topbar-right{display:flex;align-items:center;gap:14px}.topbar-user{font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace}.topbar-logout{padding:5px 12px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--muted);font-size:11px;text-decoration:none}
.main{padding:80px 28px 40px;max-width:1200px;margin:0 auto}
.placeholder{text-align:center;padding:100px 40px}
.placeholder-icon{font-size:64px;margin-bottom:20px;opacity:0.5}
.placeholder h1{font-family:'Cinzel',serif;font-size:28px;font-weight:600;letter-spacing:2px;color:var(--gold);margin-bottom:12px}
.placeholder p{font-size:15px;color:var(--dim);max-width:500px;margin:0 auto;line-height:1.7}
.placeholder .status{display:inline-block;margin-top:24px;padding:8px 20px;border:1px solid rgba(212,165,116,0.3);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:1px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">MYTHOS</div>
  <nav class="topbar-nav">
    <a href="/app/">Home</a><a href="/app/finance/">Finance</a><a href="/app/system/">System</a>
    <a href="/app/iris/">Iris</a>
    <a href="/app/sessions/">Sessions</a><a href="/app/people/">People</a><a href="/app/ontology/">Ontology</a>
    <a href="/app/quotes/">Quotes</a>
    <a href="/app/shopping/">Shopping</a><a href="/app/system/">System</a>
    <a href="/app/iris/">Iris</a>
    <a href="/app/sessions/">Sessions</a><a href="/app/registry/" class="active">Registry</a>
  </nav>
  <div class="topbar-right"><span class="topbar-user" id="user-name"></span><a href="/auth/logout" class="topbar-logout">logout</a></div>
</div>
<div class="main">
  <div class="placeholder">
    <div class="placeholder-icon">✦</div>
    <h1>The Registry</h1>
    <p>The 144 — soul registry, activation tracking, lineage mapping across incarnations, and the consciousness infrastructure graph. Neo4j-powered, sovereignty-first.</p>
    <div class="status">STATUS: SEEDING</div>
  </div>
</div>
<script>fetch('/auth/me').then(r=>{if(!r.ok)throw 'a';return r.json()}).then(d=>{document.getElementById('user-name').textContent=d.name||d.email}).catch(()=>{window.location.href='/app/login'})</script>
</body>
</html>
