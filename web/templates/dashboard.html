<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythos — Financial Command</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --bg-card: #111827;
  --bg-hover: #1a2332;
  --border: #1e293b;
  --border-light: #293548;
  --text: #e2e8f0;
  --text-dim: #64748b;
  --text-muted: #475569;
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.08);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.08);
  --amber: #f59e0b;
  --amber-bg: rgba(245,158,11,0.08);
  --blue: #3b82f6;
  --blue-bg: rgba(59,130,246,0.08);
  --cyan: #06b6d4;
  --cyan-bg: rgba(6,182,212,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.5; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* Top bar */
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--bg-card); }
.topbar-left { display: flex; align-items: center; gap: 20px; }
.topbar-nav { display: flex; gap: 4px; }
.topbar-nav a { padding: 6px 14px; border-radius: 6px; color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.15s; }
.topbar-nav a:hover { color: var(--text); background: var(--bg-hover); }
.topbar-nav a.active { color: var(--cyan); background: var(--cyan-bg); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.user-info { font-size: 12px; color: var(--text-dim); }
.logout-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 5px; background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: none; }
.logout-btn:hover { border-color: var(--red); color: var(--red); }

/* Summary cards */
.summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; padding: 20px 24px; }
.summary-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.summary-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 6px; }
.summary-card .value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; }
.summary-card .value.positive { color: var(--green); }
.summary-card .value.negative { color: var(--red); }

/* Content */
.content { padding: 0 24px 60px; }

/* Section header */
.section-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 12px; }
.section-header h2 { font-size: 16px; font-weight: 600; }

/* Filter bar */
.filter-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px 10px 0 0;
  border-bottom: none;
  align-items: center;
}
.filter-bar select,
.filter-bar input {
  background: var(--bg);
  border: 1px solid var(--border-light);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
}
.filter-bar select:focus,
.filter-bar input:focus { border-color: var(--cyan); }
.filter-bar input { width: 200px; }
.filter-bar .spacer { flex: 1; }
.filter-count { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

/* Transaction table */
.txn-table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 0 0 10px 10px;
  overflow: hidden;
}
.txn-table {
  width: 100%;
  border-collapse: collapse;
}
.txn-table th {
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.txn-table th:hover { color: var(--text-dim); }
.txn-table th.sorted { color: var(--cyan); }
.txn-table td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.txn-table tr:last-child td { border-bottom: none; }
.txn-table tr:hover td { background: var(--bg-hover); }
.txn-table tr.editing td { background: rgba(6,182,212,0.04); }

/* Amount colors */
.amt-pos { color: var(--green); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.amt-neg { color: var(--red); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.date-cell { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.acct-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
.acct-USAA { background: rgba(59,130,246,0.15); color: #60a5fa; }
.acct-SUN { background: rgba(245,158,11,0.15); color: #fbbf24; }

/* Category badge */
.cat-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  background: var(--bg-hover);
  color: var(--text-dim);
  border: 1px solid var(--border-light);
}
.cat-badge.uncategorized { color: var(--amber); border-color: rgba(245,158,11,0.3); background: var(--amber-bg); }

/* Description cell */
.desc-cell { max-width: 260px; }
.desc-cell .desc-main { color: var(--text); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desc-cell .desc-orig { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; margin-top: 1px; }

/* Edit controls */
.edit-btn {
  padding: 3px 9px;
  border-radius: 5px;
  border: 1px solid var(--border-light);
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.edit-btn:hover { color: var(--cyan); border-color: var(--cyan); }
.save-btn {
  padding: 3px 9px;
  border-radius: 5px;
  border: 1px solid rgba(34,197,94,0.4);
  background: var(--green-bg);
  color: var(--green);
  font-size: 11px;
  cursor: pointer;
  margin-right: 4px;
}
.save-btn:hover { background: rgba(34,197,94,0.15); }
.cancel-btn {
  padding: 3px 9px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
}
.cancel-btn:hover { color: var(--red); border-color: var(--red); }

/* Inline edit inputs */
.inline-input {
  background: var(--bg);
  border: 1px solid var(--cyan);
  color: var(--text);
  padding: 4px 8px;
  border-radius: 5px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  width: 100%;
  outline: none;
}
.inline-select {
  background: var(--bg);
  border: 1px solid var(--cyan);
  color: var(--text);
  padding: 4px 8px;
  border-radius: 5px;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  max-width: 180px;
}

/* Loading / empty */
.loading { text-align: center; padding: 40px; color: var(--text-muted); }
.empty { text-align: center; padding: 60px; color: var(--text-muted); font-size: 13px; }

/* Save feedback */
.save-ok { color: var(--green); font-size: 11px; margin-left: 6px; }
.save-err { color: var(--red); font-size: 11px; margin-left: 6px; }

/* Scrollable table */
.txn-table-scroll { max-height: 600px; overflow-y: auto; }

/* Pagination */
.pagination { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); }
.page-btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 12px; }
.page-btn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
.page-btn:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div style="font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:4px;color:#d4a574">MYTHOS</div>
    <nav class="topbar-nav">
      <a href="/app/">Home</a>
      <a href="/app/finance/" class="active">Finance</a>
      <a href="/app/system/">System</a>
      <a href="/app/sessions/">Sessions</a>
      <a href="/app/registry/">Registry</a>
    </nav>
  </div>
  <div class="topbar-right">
    <span class="user-info" id="user-info"></span>
    <a href="/auth/logout" class="logout-btn">logout</a>
  </div>
</div>

<div class="summary-row" id="summary-cards">
  <div class="loading">Loading...</div>
</div>

<div class="content">
  <!-- Transaction Editor -->
  <div class="section-header">
    <h2>Transactions</h2>
    <div style="font-size:12px;color:var(--text-muted)">Click any row to edit • Changes save immediately</div>
  </div>

  <div class="filter-bar">
    <select id="filter-month">
      <option value="">All months</option>
    </select>
    <select id="filter-account">
      <option value="">All accounts</option>
      <option value="USAA">USAA</option>
      <option value="SUN">Sunmark</option>
    </select>
    <select id="filter-category">
      <option value="">All categories</option>
      <option value="__uncategorized__">⚠ Uncategorized</option>
    </select>
    <input type="text" id="filter-search" placeholder="Search description..." />
    <div class="spacer"></div>
    <span class="filter-count" id="filter-count"></span>
    <button class="edit-btn" onclick="clearFilters()">Clear</button>
  </div>

  <div class="txn-table-wrap">
    <div class="txn-table-scroll">
      <table class="txn-table" id="txn-table">
        <thead>
          <tr>
            <th onclick="sortBy('transaction_date')">Date</th>
            <th onclick="sortBy('account')">Acct</th>
            <th>Description</th>
            <th onclick="sortBy('category_primary')">Category</th>
            <th onclick="sortBy('amount')" style="text-align:right">Amount</th>
            <th style="text-align:right">Balance</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="txn-body">
          <tr><td colspan="7" class="loading">Loading transactions...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="pagination" style="display:none">
      <button class="page-btn" id="prev-btn" onclick="prevPage()">← Prev</button>
      <span id="page-info"></span>
      <button class="page-btn" id="next-btn" onclick="nextPage()">Next →</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let allTxns = [];
let filteredTxns = [];
let categories = [];
let sortCol = 'transaction_date';
let sortDir = -1; // -1 = desc, 1 = asc
let currentPage = 0;
const PAGE_SIZE = 50;
let editingId = null;

// ── Init ───────────────────────────────────────────────────
fetch('/auth/me')
  .then(r => r.json())
  .then(d => { document.getElementById('user-info').textContent = d.name || d.email; })
  .catch(() => { window.location.href = '/app/login'; });

// Load summary
fetch('/api/finance/summary')
  .then(r => r.json())
  .then(data => {
    const fmt = n => {
      const abs = Math.abs(n);
      const str = abs.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
      return n < 0 ? `-$${str}` : `$${str}`;
    };
    document.getElementById('summary-cards').innerHTML = `
      <div class="summary-card"><div class="label">USAA</div><div class="value mono ${(data.balances.USAA||0)>=0?'positive':'negative'}">${fmt(data.balances.USAA||0)}</div></div>
      <div class="summary-card"><div class="label">Sunmark</div><div class="value mono ${(data.balances.SUN||0)>=0?'positive':'negative'}">${fmt(data.balances.SUN||0)}</div></div>
      <div class="summary-card"><div class="label">Combined</div><div class="value mono ${data.combined>=0?'positive':'negative'}">${fmt(data.combined)}</div></div>
      <div class="summary-card"><div class="label">Month Income</div><div class="value mono positive">${fmt(data.month_income)}</div></div>
      <div class="summary-card"><div class="label">Month Spending</div><div class="value mono negative">${fmt(data.month_spending)}</div></div>
      <div class="summary-card"><div class="label">Month Net</div><div class="value mono ${data.month_net>=0?'positive':'negative'}">${fmt(data.month_net)}</div></div>
    `;
  });

// Load categories
fetch('/api/finance/categories')
  .then(r => r.json())
  .then(data => {
    categories = data.categories;
    const sel = document.getElementById('filter-category');
    data.categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  });

// Populate month dropdown (last 12 months)
(function() {
  const sel = document.getElementById('filter-month');
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleString('en-US', {month:'long', year:'numeric'});
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = label;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  }
})();

// Load transactions
loadTransactions();

function loadTransactions() {
  const month = document.getElementById('filter-month').value;
  const account = document.getElementById('filter-account').value;
  const category = document.getElementById('filter-category').value;
  const search = document.getElementById('filter-search').value;

  let url = '/api/finance/transactions?limit=500';
  if (month) url += `&month=${month}`;
  if (account) url += `&account=${account}`;
  if (category) url += `&category=${encodeURIComponent(category)}`;
  if (search) url += `&search=${encodeURIComponent(search)}`;

  document.getElementById('txn-body').innerHTML = '<tr><td colspan="7" class="loading">Loading...</td></tr>';

  fetch(url)
    .then(r => r.json())
    .then(data => {
      allTxns = data.transactions;
      filteredTxns = [...allTxns];
      currentPage = 0;
      applySort();
      renderTable();
    })
    .catch(err => {
      document.getElementById('txn-body').innerHTML = `<tr><td colspan="7" class="empty" style="color:var(--red)">Error: ${err.message}</td></tr>`;
    });
}

// Debounced search
let searchTimer;
document.getElementById('filter-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadTransactions, 400);
});
document.getElementById('filter-month').addEventListener('change', loadTransactions);
document.getElementById('filter-account').addEventListener('change', loadTransactions);
document.getElementById('filter-category').addEventListener('change', loadTransactions);

function clearFilters() {
  document.getElementById('filter-month').value = '';
  document.getElementById('filter-account').value = '';
  document.getElementById('filter-category').value = '';
  document.getElementById('filter-search').value = '';
  loadTransactions();
}

// ── Sort ───────────────────────────────────────────────────
function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = -1; }
  document.querySelectorAll('.txn-table th').forEach(th => th.classList.remove('sorted'));
  applySort();
  renderTable();
}

function applySort() {
  filteredTxns = [...allTxns].sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (av === null || av === undefined) av = '';
    if (bv === null || bv === undefined) bv = '';
    if (typeof av === 'number') return sortDir * (av - bv);
    return sortDir * String(av).localeCompare(String(bv));
  });
}

// ── Render ─────────────────────────────────────────────────
function renderTable() {
  const start = currentPage * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const page = filteredTxns.slice(start, end);
  const total = filteredTxns.length;

  document.getElementById('filter-count').textContent = `${total} transactions`;

  if (total === 0) {
    document.getElementById('txn-body').innerHTML = '<tr><td colspan="7" class="empty">No transactions found</td></tr>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  const fmt = (n) => {
    if (n === null || n === undefined) return '—';
    const abs = Math.abs(n);
    const s = abs.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
    return n < 0 ? `-$${s}` : `$${s}`;
  };

  const rows = page.map(t => {
    const catClass = (t.category_primary) ? '' : 'uncategorized';
    const catLabel = t.category_primary || 'Uncategorized';
    const amtClass = t.amount >= 0 ? 'amt-pos' : 'amt-neg';
    const acctClass = `acct-${t.account}`;
    const origHtml = t.original_description
      ? `<div class="desc-orig" title="${esc(t.original_description)}">${esc(t.original_description)}</div>`
      : '';
    return `<tr data-id="${t.id}">
      <td class="date-cell">${t.transaction_date}</td>
      <td><span class="acct-badge ${acctClass}">${t.account}</span></td>
      <td class="desc-cell">
        <div class="desc-main" title="${esc(t.description)}">${esc(t.description)}</div>
        ${origHtml}
      </td>
      <td><span class="cat-badge ${catClass}">${esc(catLabel)}</span></td>
      <td style="text-align:right"><span class="${amtClass}">${fmt(t.amount)}</span></td>
      <td style="text-align:right"><span class="mono" style="font-size:12px;color:var(--text-dim)">${fmt(t.balance)}</span></td>
      <td style="text-align:right"><button class="edit-btn" onclick="startEdit(${t.id})">Edit</button></td>
    </tr>`;
  }).join('');

  document.getElementById('txn-body').innerHTML = rows;

  // Pagination
  const totalPages = Math.ceil(total / PAGE_SIZE);
  if (totalPages > 1) {
    document.getElementById('pagination').style.display = 'flex';
    document.getElementById('page-info').textContent = `Page ${currentPage+1} of ${totalPages}`;
    document.getElementById('prev-btn').disabled = currentPage === 0;
    document.getElementById('next-btn').disabled = currentPage >= totalPages - 1;
  } else {
    document.getElementById('pagination').style.display = 'none';
  }
}

function prevPage() { if (currentPage > 0) { currentPage--; renderTable(); } }
function nextPage() { currentPage++; renderTable(); }

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Inline Edit ────────────────────────────────────────────
function startEdit(id) {
  if (editingId && editingId !== id) cancelEdit();
  editingId = id;

  const txn = allTxns.find(t => t.id === id);
  if (!txn) return;

  const row = document.querySelector(`tr[data-id="${id}"]`);
  if (!row) return;
  row.classList.add('editing');

  const catOpts = categories.map(c =>
    `<option value="${esc(c)}" ${c === txn.category_primary ? 'selected' : ''}>${esc(c)}</option>`
  ).join('');

  const fmt = (n) => {
    if (n === null || n === undefined) return '—';
    const abs = Math.abs(n);
    const s = abs.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
    return n < 0 ? `-$${s}` : `$${s}`;
  };
  const amtClass = txn.amount >= 0 ? 'amt-pos' : 'amt-neg';
  const acctClass = `acct-${txn.account}`;

  row.innerHTML = `
    <td class="date-cell">${txn.transaction_date}</td>
    <td><span class="acct-badge ${acctClass}">${txn.account}</span></td>
    <td class="desc-cell" style="min-width:220px">
      <input class="inline-input" id="edit-desc" value="${esc(txn.description)}" placeholder="Description" />
      <div class="desc-orig" style="margin-top:4px" title="${esc(txn.original_description)}">${esc(txn.original_description||'')}</div>
    </td>
    <td>
      <select class="inline-select" id="edit-cat">
        <option value="">— Uncategorized —</option>
        ${catOpts}
      </select>
    </td>
    <td style="text-align:right"><span class="${amtClass}">${fmt(txn.amount)}</span></td>
    <td style="text-align:right"><span class="mono" style="font-size:12px;color:var(--text-dim)">${fmt(txn.balance)}</span></td>
    <td style="text-align:right;white-space:nowrap">
      <button class="save-btn" onclick="saveEdit(${id})">Save</button>
      <button class="cancel-btn" onclick="cancelEdit()">✕</button>
      <span id="save-status-${id}"></span>
    </td>
  `;

  document.getElementById('edit-desc').focus();

  // Save on Enter
  document.getElementById('edit-desc').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveEdit(id);
    if (e.key === 'Escape') cancelEdit();
  });
}

function cancelEdit() {
  if (!editingId) return;
  editingId = null;
  renderTable();
}

async function saveEdit(id) {
  const desc = document.getElementById('edit-desc')?.value?.trim();
  const cat = document.getElementById('edit-cat')?.value;
  const statusEl = document.getElementById(`save-status-${id}`);

  if (!desc) { if (statusEl) statusEl.innerHTML = '<span class="save-err">Name required</span>'; return; }

  try {
    const resp = await fetch(`/api/finance/transactions/${id}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ description: desc, category_primary: cat || null })
    });
    if (!resp.ok) throw new Error(await resp.text());

    // Update local state
    const txn = allTxns.find(t => t.id === id);
    if (txn) {
      txn.description = desc;
      txn.category_primary = cat || null;
    }

    editingId = null;
    renderTable();
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<span class="save-err">Error</span>`;
    console.error(e);
  }
}
</script>
</body>
</html>
