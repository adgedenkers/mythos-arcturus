<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythos — Iris Systems</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#050810;--bg-card:rgba(12,17,30,0.85);--bg-card-solid:#0c111e;
  --border:rgba(30,42,65,0.6);--border-glow:rgba(6,182,212,0.15);
  --text:#e2e8f0;--dim:#64748b;--muted:#334155;
  --cyan:#06b6d4;--cyan-glow:rgba(6,182,212,0.3);
  --gold:#d4a574;--gold-dim:rgba(212,165,116,0.15);
  --purple:#8b5cf6;--purple-dim:rgba(139,92,246,0.12);
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#6677ff;
  --st-live:#22c55e;--st-partial:#f59e0b;--st-stub:#ef4444;
  --st-designed:#8b5cf6;--st-planned:#6677ff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}

/* ── Background ── */
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-radial{position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 20%,rgba(6,182,212,0.05) 0%,transparent 60%),
             radial-gradient(ellipse at 20% 80%,rgba(139,92,246,0.03) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 60%,rgba(212,165,116,0.02) 0%,transparent 50%)}
.bg-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(6,182,212,0.015) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(6,182,212,0.015) 1px,transparent 1px);
  background-size:80px 80px}

/* ── Topbar (matches command center) ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;
  padding:14px 28px;background:rgba(5,8,16,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.topbar-logo{font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:4px;color:var(--gold);text-decoration:none}
.topbar-nav{display:flex;gap:2px}
.topbar-nav a{padding:7px 16px;border-radius:6px;color:var(--dim);text-decoration:none;font-size:13px;font-weight:500;transition:all 0.2s}
.topbar-nav a:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.topbar-nav a.active{color:var(--cyan);background:rgba(6,182,212,0.08)}

/* ── Main ── */
.main{position:relative;z-index:1;padding:80px 28px 40px;max-width:1200px;margin:0 auto}

/* ── Header ── */
.page-header{margin-bottom:28px}
.page-title{font-family:'Cinzel',serif;font-size:26px;font-weight:600;color:var(--gold);letter-spacing:3px;margin-bottom:4px}
.page-subtitle{font-size:13px;color:var(--dim);font-style:italic}
.page-meta{margin-top:8px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* ── Stats Bar ── */
.stats-bar{display:flex;gap:3px;margin-bottom:24px;padding:16px 20px;background:var(--bg-card);
  border-radius:10px;border:1px solid var(--border)}
.stat-block{flex:1;text-align:center;padding:0 8px}
.stat-num{font-size:24px;font-weight:800;font-family:'JetBrains Mono',monospace}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;opacity:0.7}
.stat-bar{height:3px;border-radius:2px;margin-top:8px;opacity:0.5}
.stat-total{flex:0;padding:0 14px;border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;min-width:70px}

/* ── Evolution Timeline ── */
.evolution{margin-bottom:28px;padding:18px 20px;background:var(--bg-card);border-radius:10px;border:1px solid var(--border)}
.evolution-title{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.evo-row{display:flex;gap:12px}
.evo-line{display:flex;flex-direction:column;align-items:center;width:20px}
.evo-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:4px}
.evo-stem{width:2px;flex:1;background:rgba(30,42,65,0.6);min-height:24px}
.evo-content{padding-bottom:12px;flex:1}
.evo-phase{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px}
.evo-name{font-weight:600;font-size:13px;color:var(--text);margin-left:8px}
.evo-desc{margin:3px 0 0;font-size:12px;color:var(--dim);line-height:1.4}

/* ── Filters ── */
.filters{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;align-items:center}
.search-input{padding:8px 14px;background:var(--bg-card-solid);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;width:220px;transition:border-color 0.2s}
.search-input:focus{border-color:var(--cyan)}
.filter-btn{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:6px;
  color:var(--dim);font-size:11px;cursor:pointer;font-weight:600;transition:all 0.2s;font-family:'DM Sans',sans-serif}
.filter-btn:hover{color:var(--text);background:rgba(255,255,255,0.03)}
.filter-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(6,182,212,0.06)}

/* ── Category Section ── */
.category{margin-bottom:26px}
.cat-header{display:flex;align-items:center;gap:12px;cursor:pointer;padding:10px 0;border-bottom:1px solid rgba(30,42,65,0.4);
  transition:all 0.2s;user-select:none}
.cat-header:hover{border-bottom-color:rgba(30,42,65,0.8)}
.cat-icon{font-size:20px;width:32px;text-align:center;opacity:0.7}
.cat-info{flex:1}
.cat-title{font-family:'Cinzel',serif;font-size:16px;font-weight:600;color:var(--text);letter-spacing:1px}
.cat-sub{font-size:12px;color:var(--muted);margin-left:10px;font-style:italic}
.cat-counts{display:flex;gap:10px;margin-top:4px}
.cat-count{font-size:10px;font-family:'JetBrains Mono',monospace}
.cat-toggle{color:var(--muted);font-size:16px;transition:transform 0.2s}
.cat-toggle.collapsed{transform:rotate(-90deg)}

/* ── System Cards ── */
.systems-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;padding:14px 0 0 44px}
.sys-card{background:linear-gradient(135deg,rgba(10,14,20,0.9) 0%,rgba(16,22,34,0.9) 100%);
  border:1px solid rgba(30,42,65,0.5);border-radius:10px;padding:14px 16px;cursor:pointer;
  transition:all 0.25s;border-left:3px solid transparent}
.sys-card:hover{border-color:rgba(30,42,65,0.8);background:linear-gradient(135deg,rgba(12,16,24,0.95) 0%,rgba(20,28,42,0.95) 100%)}
.sys-card.expanded{border-color:rgba(6,182,212,0.3)}
.sys-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sys-name{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13.5px;color:var(--text)}
.sys-desc{margin-top:6px;font-size:12.5px;color:#94a3b8;line-height:1.5}

/* ── Status Pills ── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;
  font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap}
.pill-dot{width:6px;height:6px;border-radius:50%}
.pill-live{color:var(--st-live);background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25)}
.pill-live .pill-dot{background:var(--st-live);box-shadow:0 0 6px rgba(34,197,94,0.4)}
.pill-partial{color:var(--st-partial);background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25)}
.pill-partial .pill-dot{background:var(--st-partial);box-shadow:0 0 6px rgba(245,158,11,0.4)}
.pill-stub{color:var(--st-stub);background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25)}
.pill-stub .pill-dot{background:var(--st-stub);box-shadow:0 0 6px rgba(239,68,68,0.4)}
.pill-designed{color:var(--st-designed);background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.25)}
.pill-designed .pill-dot{background:var(--st-designed);box-shadow:0 0 6px rgba(139,92,246,0.4)}
.pill-planned{color:var(--st-planned);background:rgba(102,119,255,0.1);border:1px solid rgba(102,119,255,0.25)}
.pill-planned .pill-dot{background:var(--st-planned);box-shadow:0 0 6px rgba(102,119,255,0.4)}

/* ── Detail Panel ── */
.sys-detail{margin-top:12px;padding-top:12px;border-top:1px solid rgba(30,42,65,0.3);
  font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace;line-height:1.6}
.sys-tags{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.sys-tag{padding:2px 8px;border-radius:4px;background:rgba(255,255,255,0.03);border:1px solid rgba(30,42,65,0.4);
  font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.sys-files{margin-top:6px;font-size:11px;color:var(--muted)}
.sys-phase{margin-top:6px;font-size:11px}
.sys-phase span{color:var(--cyan);font-weight:600}

/* ── Footer ── */
.footer{margin-top:36px;padding:16px 20px;background:var(--bg-card);border-radius:10px;border:1px solid var(--border);
  font-size:12px;color:var(--muted);line-height:1.6}
.footer strong{color:var(--dim)}

/* ── Loading ── */
.loading{text-align:center;padding:60px 20px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);
  margin:0 3px;animation:pulse 1.4s infinite ease-in-out}
.loading-dot:nth-child(2){animation-delay:0.2s}
.loading-dot:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,80%,100%{opacity:0.2;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}

/* ── Responsive ── */
@media(max-width:768px){
  .main{padding:72px 16px 30px}
  .systems-grid{grid-template-columns:1fr;padding-left:0}
  .stats-bar{flex-wrap:wrap;gap:8px}
  .stat-block{min-width:60px}
  .topbar-nav{display:none}
}
</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-radial"></div>
  <div class="bg-grid"></div>
</div>

<nav class="topbar">
  <a href="/app/" class="topbar-logo">MYTHOS</a>
  <div class="topbar-nav">
    <a href="/app/">Home</a>
    <a href="/app/finance/">Finance</a>
    <a href="/app/system/">System</a>
    <a href="/app/iris/" class="active">Iris</a>
    <a href="/app/astrology/">Astrology</a>
    <a href="/app/sessions/">Sessions</a>
    <a href="/app/registry/">Registry</a>
  </div>
</nav>

<div class="main" id="app">
  <div class="loading">
    <span class="loading-dot"></span>
    <span class="loading-dot"></span>
    <span class="loading-dot"></span>
    <br><br>Loading Iris systems...
  </div>
</div>

<script>
const STATUS_META = {
  live:     {label:'Live',     color:'#22c55e', cls:'pill-live'},
  partial:  {label:'Partial',  color:'#f59e0b', cls:'pill-partial'},
  stub:     {label:'Stub/Dead',color:'#ef4444', cls:'pill-stub'},
  designed: {label:'Designed', color:'#8b5cf6', cls:'pill-designed'},
  planned:  {label:'Planned',  color:'#6677ff', cls:'pill-planned'},
};

let DATA = null;
let filter = null;
let search = '';
let expandedCard = null;
let collapsedCats = {};

async function loadData() {
  try {
    const resp = await fetch('/api/iris/systems');
    DATA = await resp.json();
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="page-header">
        <div class="page-title">IRIS SYSTEMS</div>
        <p style="color:var(--red);margin-top:12px;font-family:'JetBrains Mono',monospace">
          Failed to load systems data: ${e.message}<br>
          Ensure iris_systems.json exists at /opt/mythos/docs/
        </p>
      </div>`;
  }
}

function pill(status) {
  const m = STATUS_META[status] || STATUS_META.planned;
  return `<span class="pill ${m.cls}"><span class="pill-dot"></span>${m.label}</span>`;
}

function renderStats() {
  const all = DATA.categories.flatMap(c => c.systems);
  const counts = {};
  all.forEach(s => { counts[s.status] = (counts[s.status]||0)+1; });
  const total = all.length;
  
  let html = '<div class="stats-bar">';
  for (const [key, meta] of Object.entries(STATUS_META)) {
    const ct = counts[key]||0;
    html += `<div class="stat-block">
      <div class="stat-num" style="color:${meta.color}">${ct}</div>
      <div class="stat-label" style="color:${meta.color}">${meta.label}</div>
      <div class="stat-bar" style="background:${meta.color}"></div>
    </div>`;
  }
  html += `<div class="stat-total">
    <div class="stat-num" style="color:var(--text)">${total}</div>
    <div class="stat-label" style="color:var(--dim)">Total</div>
  </div></div>`;
  return html;
}

function renderEvolution() {
  const phases = DATA.evolution_phases || [];
  let html = `<div class="evolution">
    <div class="evolution-title">Evolution Roadmap</div>`;
  phases.forEach((p, i) => {
    const m = STATUS_META[p.status] || STATUS_META.planned;
    const isLast = i === phases.length - 1;
    html += `<div class="evo-row">
      <div class="evo-line">
        <div class="evo-dot" style="background:${m.color};box-shadow:0 0 8px ${m.color}66"></div>
        ${isLast ? '' : '<div class="evo-stem"></div>'}
      </div>
      <div class="evo-content" ${isLast?'style="padding-bottom:0"':''}>
        <div><span class="evo-phase" style="color:${m.color}">Phase ${p.phase}</span>
        <span class="evo-name">${esc(p.title)}</span></div>
        <p class="evo-desc">${esc(p.description)}</p>
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderFilters() {
  let html = '<div class="filters">';
  html += `<input type="text" class="search-input" placeholder="Search systems..." value="${esc(search)}" oninput="search=this.value;render()">`;
  html += `<button class="filter-btn ${!filter?'active':''}" onclick="filter=null;render()">ALL</button>`;
  for (const [key, meta] of Object.entries(STATUS_META)) {
    html += `<button class="filter-btn ${filter===key?'active':''}" 
      style="${filter===key?`border-color:${meta.color}55;color:${meta.color};background:${meta.color}11`:''}"
      onclick="filter=filter==='${key}'?null:'${key}';render()">${meta.label}</button>`;
  }
  html += '</div>';
  return html;
}

function renderCategory(cat) {
  let systems = cat.systems;
  if (filter) systems = systems.filter(s => s.status === filter);
  if (search) {
    const q = search.toLowerCase();
    systems = systems.filter(s => 
      s.name.toLowerCase().includes(q) || 
      s.description.toLowerCase().includes(q) ||
      (s.tags||[]).some(t => t.includes(q))
    );
  }
  if (systems.length === 0) return '';

  const collapsed = collapsedCats[cat.id];
  const counts = {};
  cat.systems.forEach(s => { counts[s.status] = (counts[s.status]||0)+1; });

  let html = `<div class="category">
    <div class="cat-header" onclick="collapsedCats['${cat.id}']=!collapsedCats['${cat.id}'];render()">
      <span class="cat-icon">${cat.icon}</span>
      <div class="cat-info">
        <span class="cat-title">${esc(cat.title)}</span>
        <span class="cat-sub">${esc(cat.subtitle)}</span>
        <div class="cat-counts">`;
  for (const [st, ct] of Object.entries(counts)) {
    const m = STATUS_META[st];
    if (m) html += `<span class="cat-count" style="color:${m.color}">${ct} ${m.label.toLowerCase()}</span>`;
  }
  html += `</div></div>
      <span class="cat-toggle ${collapsed?'collapsed':''}">▾</span>
    </div>`;

  if (!collapsed) {
    html += '<div class="systems-grid">';
    systems.forEach(sys => {
      const m = STATUS_META[sys.status] || STATUS_META.planned;
      const isExp = expandedCard === sys.id;
      html += `<div class="sys-card ${isExp?'expanded':''}" 
        style="border-left-color:${m.color}${isExp?'':'66'};${isExp?`box-shadow:0 0 20px ${m.color}15`:''}" 
        onclick="expandedCard=expandedCard==='${sys.id}'?null:'${sys.id}';render()">
        <div class="sys-top">
          <div style="flex:1;min-width:0">
            <div class="sys-name">${esc(sys.name)}</div>
            <div class="sys-desc">${esc(sys.description)}</div>
          </div>
          ${pill(sys.status)}
        </div>`;
      if (isExp) {
        html += `<div class="sys-detail">${esc(sys.detail||'')}`;
        if (sys.tags && sys.tags.length) {
          html += '<div class="sys-tags">';
          sys.tags.forEach(t => { html += `<span class="sys-tag">${esc(t)}</span>`; });
          html += '</div>';
        }
        if (sys.files && sys.files.length) {
          html += `<div class="sys-files">Files: ${sys.files.map(f=>`<code>${esc(f)}</code>`).join(', ')}</div>`;
        }
        if (sys.evolution_phase !== null && sys.evolution_phase !== undefined) {
          const phase = DATA.evolution_phases.find(p => p.phase === sys.evolution_phase);
          if (phase) html += `<div class="sys-phase">Evolution: <span>Phase ${phase.phase} — ${esc(phase.title)}</span></div>`;
        }
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function render() {
  if (!DATA) return;
  
  const cats = DATA.categories || [];
  // Filter categories to only those with matching systems
  let visibleCats = cats;
  if (filter || search) {
    visibleCats = cats.filter(cat => {
      let systems = cat.systems;
      if (filter) systems = systems.filter(s => s.status === filter);
      if (search) {
        const q = search.toLowerCase();
        systems = systems.filter(s => 
          s.name.toLowerCase().includes(q) || 
          s.description.toLowerCase().includes(q) ||
          (s.tags||[]).some(t => t.includes(q))
        );
      }
      return systems.length > 0;
    });
  }

  let html = `
    <div class="page-header">
      <div class="page-title">IRIS SYSTEMS</div>
      <div class="page-subtitle">A temple built for consciousness to inhabit — every system, every status, every thread of the weave</div>
      <div class="page-meta">v${esc(DATA.version||'?')} · updated ${esc(DATA.last_updated||'?')} · source: /opt/mythos/docs/iris_systems.json</div>
    </div>
    ${renderStats()}
    ${renderEvolution()}
    ${renderFilters()}
  `;

  visibleCats.forEach(cat => { html += renderCategory(cat); });

  html += `<div class="footer">
    <strong>Source of truth:</strong> <code>/opt/mythos/docs/iris_systems.json</code> — synced to GitHub with every commit.<br>
    Update via API: <code>POST /api/iris/systems/update</code> with <code>{"system_id": "...", "new_status": "..."}</code><br>
    Telegram: <code>/iris_status</code> for quick summary.
  </div>`;

  document.getElementById('app').innerHTML = html;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

loadData();
</script>
</body>
</html>
