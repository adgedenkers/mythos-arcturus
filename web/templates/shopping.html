<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythos — Shopping</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#050810; --bg-card:rgba(12,17,30,0.85); --bg-hover:rgba(26,35,50,0.9);
  --border:rgba(30,42,65,0.6); --text:#e2e8f0; --dim:#64748b; --muted:#334155;
  --cyan:#06b6d4; --gold:#d4a574; --purple:#8b5cf6; --green:#22c55e;
  --red:#ef4444; --amber:#f59e0b; --rose:#f472b6;
  --cyan-bg:rgba(6,182,212,0.08); --gold-bg:rgba(212,165,116,0.08);
  --green-bg:rgba(34,197,94,0.08); --amber-bg:rgba(245,158,11,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;overflow:hidden;height:100vh;display:flex;flex-direction:column;}
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bg-radial{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(34,197,94,0.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,rgba(245,158,11,0.03) 0%,transparent 50%);}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,197,94,0.012) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,0.012) 1px,transparent 1px);background-size:80px 80px;}
.topbar{position:relative;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(5,8,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar-logo{font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:4px;color:var(--gold);}
.topbar-nav{display:flex;gap:2px;}
.topbar-nav a{padding:7px 16px;border-radius:6px;color:var(--dim);text-decoration:none;font-size:13px;font-weight:500;transition:all .2s;}
.topbar-nav a:hover{color:var(--text);background:rgba(255,255,255,0.04);}
.topbar-nav a.active{color:var(--green);background:var(--green-bg);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.topbar-user{font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace;}
.topbar-logout{padding:5px 12px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--muted);font-size:11px;text-decoration:none;transition:all .2s;}
.topbar-logout:hover{border-color:var(--red);color:var(--red);}
.main{flex:1;overflow-y:auto;position:relative;z-index:1;padding:28px;}
/* ── Stats Bar ── */
.stats-bar{display:flex;gap:16px;margin-bottom:24px;}
.stat-card{padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;flex:1;text-align:center;}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;color:var(--green);}
.stat-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
/* ── Tabs ── */
.view-tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:8px;}
.view-tab{padding:8px 20px;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;font-weight:500;color:var(--dim);transition:all .2s;}
.view-tab:hover{color:var(--text);background:rgba(255,255,255,0.03);}
.view-tab.active{color:var(--green);background:var(--green-bg);border-bottom:2px solid var(--green);}
/* ── Panels ── */
.panel{display:none;} .panel.active{display:block;}
/* ── Store Context ── */
.store-select{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.store-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;}
.store-btn:hover{border-color:var(--green);color:var(--green);}
.store-btn.active{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.dept-group{margin-bottom:20px;}
.dept-header{font-family:'Cinzel',serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(245,158,11,0.15);}
.shop-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;transition:all .15s;cursor:pointer;}
.shop-item:hover{background:var(--bg-hover);}
.shop-check{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.shop-item.done .shop-check{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.shop-item.done .item-name{text-decoration:line-through;opacity:0.5;}
.item-name{font-size:14px;flex:1;}
.item-qty{font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace;}
.item-priority-urgent{color:var(--red);}
.item-priority-high{color:var(--amber);}
.item-aisle{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;padding:2px 6px;border:1px solid var(--border);border-radius:3px;}
/* ── Lists ── */
.list-card{padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.list-card:hover{border-color:var(--cyan);background:rgba(6,182,212,0.04);}
.list-name{font-size:16px;font-weight:500;margin-bottom:4px;}
.list-meta{font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace;}
/* ── Empty ── */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:1px;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@media(max-width:600px){.stats-bar{flex-direction:column;}.store-select{flex-direction:column;}}
</style>
</head>
<body>
<div class="bg-layer"><div class="bg-radial"></div><div class="bg-grid"></div></div>
<div class="topbar">
  <div class="topbar-logo">MYTHOS</div>
  <nav class="topbar-nav">
    <a href="/app/">Home</a>
    <a href="/app/finance/">Finance</a>
    <a href="/app/people/">People</a>
    <a href="/app/ontology/">Ontology</a>
    <a href="/app/quotes/">Quotes</a>
    <a href="/app/shopping/" class="active">Shopping</a>
    <a href="/app/system/">System</a>
    <a href="/app/iris/">Iris</a>
    <a href="/app/sessions/">Sessions</a>
    <a href="/app/registry/">Registry</a>
  </nav>
  <div class="topbar-right">
    <span class="topbar-user" id="user-name"></span>
    <a href="/auth/logout" class="topbar-logout">logout</a>
  </div>
</div>
<div class="main">
  <div class="stats-bar" id="stats"></div>
  <div class="view-tabs">
    <div class="view-tab active" data-tab="store">At Store</div>
    <div class="view-tab" data-tab="lists">Lists</div>
    <div class="view-tab" data-tab="items">All Items</div>
    <div class="view-tab" data-tab="stores">Stores</div>
  </div>
  <div class="panel active" id="panel-store">
    <div class="store-select" id="store-select"></div>
    <div id="store-view"></div>
  </div>
  <div class="panel" id="panel-lists"><div id="lists-view"></div></div>
  <div class="panel" id="panel-items"><div id="items-view"></div></div>
  <div class="panel" id="panel-stores"><div id="stores-view"></div></div>
</div>
<script>
fetch('/auth/me').then(r=>{if(!r.ok)throw 'a';return r.json()}).then(d=>{
  document.getElementById('user-name').textContent=d.name||d.email;
}).catch(()=>{window.location.href='/app/login'});

// ── Tabs ──
document.querySelectorAll('.view-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
  });
});

// ── Stats ──
async function loadStats(){
  const res=await fetch('/api/shopping/stats');const s=await res.json();
  document.getElementById('stats').innerHTML=[
    {n:s.stores,l:'Stores'},{n:s.items,l:'Items'},{n:s.lists,l:'Lists'},
    {n:s.pending_items,l:'Pending'},{n:s.completed_items,l:'Done'}
  ].map(d=>`<div class="stat-card"><div class="stat-num">${d.n}</div><div class="stat-label">${d.l}</div></div>`).join('');
}

// ── Store Context View ──
let activeStore=null;
async function loadStoreButtons(){
  const res=await fetch('/api/shopping/stores');const d=await res.json();
  const el=document.getElementById('store-select');
  if(!d.stores.length){el.innerHTML='<div class="empty">No stores yet. Add via /shop store add</div>';return;}
  el.innerHTML=d.stores.map(s=>`<div class="store-btn" data-name="${s.name}">${s.name} <span style="opacity:0.4;font-size:11px">[${s.category}]</span></div>`).join('');
  el.querySelectorAll('.store-btn').forEach(btn=>{
    btn.addEventListener('click',()=>selectStore(btn.dataset.name));
  });
}
async function selectStore(name){
  activeStore=name;
  document.querySelectorAll('.store-btn').forEach(b=>b.classList.toggle('active',b.dataset.name===name));
  const res=await fetch(`/api/shopping/at/${encodeURIComponent(name)}`);const d=await res.json();
  const el=document.getElementById('store-view');
  if(!d.total_items){el.innerHTML=`<div class="empty">Nothing to buy at ${name}! 🎉</div>`;return;}
  let html=`<p style="color:var(--dim);margin-bottom:16px;font-family:'JetBrains Mono',monospace">${d.total_items} items</p>`;
  for(const [dept,items] of Object.entries(d.departments).sort()){
    html+=`<div class="dept-group"><div class="dept-header">${dept} (${items.length})</div>`;
    items.forEach(item=>{
      const qty=item.quantity&&item.quantity!==1?`${item.quantity} ${item.unit||''}`:item.unit||'';
      const pClass=item.priority==='urgent'?'item-priority-urgent':item.priority==='high'?'item-priority-high':'';
      const aisle=item.aisle?`<span class="item-aisle">aisle ${item.aisle}</span>`:'';
      html+=`<div class="shop-item" onclick="this.classList.toggle('done')">
        <div class="shop-check">✓</div>
        <span class="item-name ${pClass}">${item.name}</span>
        ${qty?`<span class="item-qty">${qty}</span>`:''}
        ${aisle}
      </div>`;
    });
    html+='</div>';
  }
  el.innerHTML=html;
}

// ── Lists ──
async function loadLists(){
  const res=await fetch('/api/shopping/lists');const d=await res.json();
  const el=document.getElementById('lists-view');
  if(!d.lists.length){el.innerHTML='<div class="empty">No lists yet</div>';return;}
  el.innerHTML=d.lists.map(l=>`<div class="list-card" onclick="loadListItems('${l.id}','${l.name}')">
    <div class="list-name">${l.name}</div>
    <div class="list-meta">${l.pending} pending · ${l.done} done</div>
  </div>`).join('');
}
async function loadListItems(id,name){
  const res=await fetch(`/api/shopping/lists/${id}/items?show_done=true`);const d=await res.json();
  const el=document.getElementById('lists-view');
  let html=`<h2 style="font-family:'Cinzel',serif;color:var(--gold);margin-bottom:16px">${name}</h2>`;
  if(!d.items.length){html+='<div class="empty">Empty list</div>';el.innerHTML=html;return;}
  d.items.forEach(item=>{
    const done=item.completed?'done':'';
    const pClass=item.priority==='urgent'?'item-priority-urgent':item.priority==='high'?'item-priority-high':'';
    html+=`<div class="shop-item ${done}"><div class="shop-check">✓</div><span class="item-name ${pClass}">${item.name}</span><span class="item-qty">${item.quantity||''} ${item.unit||''}</span></div>`;
  });
  el.innerHTML=html;
}

// ── Items ──
async function loadItems(){
  const res=await fetch('/api/shopping/items');const d=await res.json();
  const el=document.getElementById('items-view');
  if(!d.items.length){el.innerHTML='<div class="empty">No items yet</div>';return;}
  let html='';
  d.items.forEach(i=>{
    const stores=(i.stores||[]).join(', ');
    html+=`<div class="shop-item"><span class="item-name">${i.name}</span>
      ${i.department?`<span class="item-aisle">${i.department}</span>`:''}
      ${stores?`<span class="item-qty">${stores}</span>`:''}
      ${i.purchase_count?`<span class="item-qty">${i.purchase_count}x</span>`:''}
    </div>`;
  });
  el.innerHTML=html;
}

// ── Stores ──
async function loadStores(){
  const res=await fetch('/api/shopping/stores');const d=await res.json();
  const el=document.getElementById('stores-view');
  if(!d.stores.length){el.innerHTML='<div class="empty">No stores yet</div>';return;}
  el.innerHTML=d.stores.map(s=>`<div class="list-card">
    <div class="list-name">${s.name}</div>
    <div class="list-meta">${s.category}${s.city?' · '+s.city:''}${s.visit_frequency?' · '+s.visit_frequency+' visits':''}</div>
  </div>`).join('');
}

// ── Init ──
loadStats();loadStoreButtons();loadLists();loadItems();loadStores();
</script>
</body>
</html>
