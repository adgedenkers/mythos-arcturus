# ═══════════════════════════════════════════════════════════════
# VALIDATION SCHEMA
# ═══════════════════════════════════════════════════════════════

validation:
  required_fields:
    - "message_type"
    - "complexity"
    - "processing_path"
    - "entities"
    - "grid_hints"
    - "emotion"
    - "energy"
    - "topics"
    - "references_past"
    - "needs_context"
    - "response_guidance"
  
  enum_fields:
    message_type:
      - "greeting"
      - "filler"
      - "life_event"
      - "question_deep"
      - "question_technical"
      - "question_cosmology"
      - "question_life_logistics"
      - "request_action"
      - "emotional_expression"
      - "information_sharing"
      - "multi_part"
    complexity:
      - "trivial"
      - "simple"
      - "moderate"
      - "complex"
      - "deep"
    processing_path:
      - "fast"
      - "standard"
      - "full"
    energy:
      - "low"
      - "medium"
      - "high"
  
  range_fields:
    grid_hints.*: [0.0, 1.0]
    emotion.intensity: [0.0, 1.0]
  
  # Consistency rules
  consistency:
    - if: {complexity: "trivial"}
      then: {processing_path: "fast"}
    - if: {message_type: "greeting"}
      then: {complexity: ["trivial", "simple"]}
    - if: {message_type: "filler"}
      then: {complexity: "trivial", processing_path: "fast"}
    - if: {processing_path: "full"}
      then: {complexity: ["complex", "deep"]}
