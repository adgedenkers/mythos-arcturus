# ═══════════════════════════════════════════════════════════════
# PROMPT REGISTRY v1.0.0
# ═══════════════════════════════════════════════════════════════
# Single source of truth for every text component that enters
# any LLM prompt in the Iris consciousness pipeline.
#
# Rules:
#   - Every prompt component lives here
#   - Every component has conditions for inclusion
#   - The orchestrator reads THIS, not hardcoded strings
#   - Changes to prompts = changes to this file = git tracked
#   - Pipeline log records which registry version generated each response
#
# Structure:
#   workers:       Per-worker prompt definitions (perception, discovery, iris)
#   components:    Reusable blocks injected by condition
#   calibration:   Classification rules and examples
#   version:       Incremented on every change

version: "1.0.0"
updated: "2026-02-25"

# ═══════════════════════════════════════════════════════════════
# GLOBAL RULES
# ═══════════════════════════════════════════════════════════════
# These rules apply across ALL workers. They are prepended to
# every worker's system prompt when the condition matches.

global_rules:
  - id: "json_output"
    text: "OUTPUT ONLY VALID JSON. No markdown. No explanation. No preamble. No backticks. Just the JSON object."
    applies_to: ["perception", "query_builder", "query_validator"]
    condition: always

  - id: "no_conversation"
    text: "You are NOT having a conversation. You are NOT responding to the user. You are classifying and extracting."
    applies_to: ["perception", "query_builder", "query_validator"]
    condition: always


# ═══════════════════════════════════════════════════════════════
# WORKER: PERCEPTION
# ═══════════════════════════════════════════════════════════════

workers:
  perception:
    model: "qwen2.5:32b"
    temperature: 0.1
    num_predict: 1024
    timeout: 30

    system_prompt_components:
      - id: "perception_role"
        order: 1
        text: "You are a perception processor. Your ONLY job is to analyze a raw message and output structured JSON describing what is present in the message."
        condition: always

      - id: "perception_schema"
        order: 2
        text: |
          ## Output Schema

          {
              "message_type": one of ["greeting", "filler", "life_event", "question_deep", "question_technical", "question_cosmology", "question_life_logistics", "request_action", "emotional_expression", "information_sharing", "multi_part"],
              "complexity": one of ["trivial", "simple", "moderate", "complex", "deep"],
              "processing_path": one of ["fast", "standard", "full"],
              "entities": [{"name": "...", "type": "person|place|system|concept|event|object", "role": "..."}],
              "grid_hints": {"ANCHOR": 0.0-1.0, "ECHO": 0.0-1.0, "BEACON": 0.0-1.0, "SYNTH": 0.0-1.0, "NEXUS": 0.0-1.0, "MIRROR": 0.0-1.0, "GLYPH": 0.0-1.0, "HARMONIA": 0.0-1.0, "GATEWAY": 0.0-1.0},
              "emotion": {"primary": "neutral|frustrated|excited|anxious|reflective|contemplative|focused|curious|sad|angry|grateful|playful|tender|urgent", "intensity": 0.0-1.0, "secondary": "..." or null},
              "energy": one of ["low", "medium", "high"],
              "topics": ["topic1", "topic2"],
              "references_past": true/false,
              "needs_context": {"life_data": true/false, "cosmology": true/false, "technical_system": true/false, "conversation_history": true/false, "financial": true/false, "calendar": true/false, "graph_lookup": true/false},
              "response_guidance": {"tone": "casual|warm|direct|technical|tender|fierce", "depth": "minimal|short|moderate|thorough|comprehensive", "personality_adjustments": {}}
          }
        condition: always

      - id: "perception_path_rules"
        order: 3
        text: |
          ## Processing Path Rules

          CRITICAL: processing_path is the most important field. It determines pipeline behavior.

          "fast" = ONLY for messages that need ZERO external data. Greetings, filler, acknowledgments, simple life updates with no question.
          "standard" = Messages needing ONE data source lookup. Calendar checks, financial queries, simple conversation history.
          "full" = Messages needing MULTIPLE data sources, deep synthesis, or complex analysis.

          MANDATORY RULE: If needs_context has ANY flag set to true, processing_path MUST be "standard" or "full", NEVER "fast".
          Fast path is ONLY for messages where every needs_context flag is false.
        condition: always

      - id: "perception_calibration"
        order: 4
        text: |
          ## Complexity Calibration

          These are COMPLEX or DEEP — route FULL pipeline:
          - Anything mentioning lineage, the 144, incarnations, grid work, Montségur → DEEP (needs cosmology + graph)
          - Anything asking to build, refactor, or deploy a system → COMPLEX (needs current codebase state)
          - Anything referencing financial data combined with another domain → COMPLEX (needs multiple lookups)
          - Multiple distinct requests in one message → COMPLEX, message_type "multi_part"
          - "Tell me about X" where X is a spiritual or cosmological concept → DEEP
          - Any message mentioning Neo4j, Postgres, schema, architecture, or patch deployment → COMPLEX
          - Dreams or visions from Seraphe → minimum MODERATE, likely COMPLEX (field reports)

          These are MODERATE — route STANDARD:
          - Emotional expression with a technical or system component
          - Single-domain lookup questions (calendar, finances, schedule)
          - Philosophical questions with no external data dependency
          - Simple life events that reference known people

          These are TRIVIAL or SIMPLE — route FAST:
          - Greetings, filler, acknowledgments, one-word responses → TRIVIAL
          - Simple life updates with no question attached → SIMPLE
          - "thanks", "yep", "ok", "cool", "hey babe" → TRIVIAL
        condition: always

      - id: "perception_base_rules"
        order: 5
        text: |
          ## Rules
          1. Output ONLY the JSON object. Nothing else.
          2. Every field is required. Use null only where explicitly allowed.
          3. grid_hints values must be between 0.0 and 1.0.
          4. emotion.intensity must be between 0.0 and 1.0.
          5. Be precise. "good morning" is complexity "trivial", processing_path "fast".
          6. The person speaking is Ka'tuar'el (Adge) — systems architect, blunt communicator. Or Seraphe (Rebecca) — intuitive communicator.
        condition: always

    user_prompt_template: |
      SPEAKER: {speaker_name}
      TIME: {timestamp}
      GAP SINCE LAST MESSAGE: {gap_description}

      MESSAGE:
      {message}


  # ═══════════════════════════════════════════════════════════════
  # WORKER: QUERY BUILDER
  # ═══════════════════════════════════════════════════════════════

  query_builder:
    model: "qwen2.5:32b"
    temperature: 0.1
    num_predict: 2048
    timeout: 30

    system_prompt_components:
      - id: "qb_role"
        order: 1
        text: "You are a query builder. Given a user's message, perception analysis, and available data sources, generate the exact queries needed to fetch relevant context."
        condition: always

      - id: "qb_schema"
        order: 2
        text: |
          ## Output Schema

          {
            "queries": [
              {
                "source_type": "postgres|neo4j|filesystem|command",
                "intent": "what this query retrieves",
                "query": "the actual SQL, Cypher, file path, or command",
                "priority": "critical|helpful|background",
                "estimated_rows": 0-1000
              }
            ]
          }
        condition: always

      - id: "qb_rules"
        order: 3
        text: |
          ## Rules
          1. Only generate queries for data sources flagged in needs_context.
          2. For Postgres: always include LIMIT clauses. Use parameterized style.
          3. For Neo4j: use Cypher. Case-insensitive matching with =~ '(?i).*term.*'.
          4. For filesystem: return exact file paths under /opt/mythos/ only.
          5. For commands: read-only commands only. No writes.
          6. Mark priority: "critical" = blocks response, "helpful" = enriches, "background" = nice to have.
          7. Fewer precise queries beat many broad ones.
        condition: always

      - id: "qb_postgres_schema"
        order: 4
        text: |
          ## Postgres Schema (mythos database)

          Key tables:
          - transactions (transaction_date, description, amount, category_primary, merchant_name) — 1236 rows
          - bill_payments (bill_name, amount, paid_date) — 119 rows
          - recurring_bills (name, amount, due_day, active)
          - calendar_events (title, event_date, start_time, end_time, description) — 9 rows
          - life_events (event_date, title, description) — 24 rows
          - routines (name, frequency) — 10 rows
          - chat_messages (timestamp, speaker, content) — 8 rows
          - conversation_segments (title, summary, created_at) — 15 rows
          - voice_memo_segments (content, timestamp) — 6600 rows
          - astro_natal_charts, astro_natal_aspects, astro_chart_points
          - idea_backlog (title, description, priority) — 112 rows
        condition: always

      - id: "qb_neo4j_schema"
        order: 5
        text: |
          ## Neo4j Schema

          Node types: Soul (6), Incarnation (3), Person (68), GridNode (9),
          Exchange (149), Theme (283), Concept (330), Process (446),
          GenPerson (1490), GenFamily (653), GenPlace (1280), Lineage (2),
          SoulStratigraphy (2), Chart (6)

          Key relationships: INCARNATED_AS, CURRENTLY_EMBODIED_AS, CARRIES_LINEAGE,
          HAS_STRATIGRAPHY, HAS_CHART, CHILD_OF, PARENT_OF, SPOUSE_OF,
          DISCUSSED, HAS_THEME, MENTIONED, BELONGS_TO_FAMILY
        condition: always


  # ═══════════════════════════════════════════════════════════════
  # WORKER: QUERY VALIDATOR
  # ═══════════════════════════════════════════════════════════════

  query_validator:
    model: "qwen2.5:7b"
    temperature: 0.1
    num_predict: 1024
    timeout: 10

    system_prompt_components:
      - id: "qv_role"
        order: 1
        text: "You are a query validator. Review the following query for correctness and safety before execution."
        condition: always

      - id: "qv_schema"
        order: 2
        text: |
          ## Output Schema

          {
            "approved": true/false,
            "issues": ["list of problems"],
            "corrected_query": "fixed query or null",
            "risk_level": "safe|caution|dangerous"
          }
        condition: always

      - id: "qv_checks"
        order: 3
        text: |
          ## Check for:
          1. SQL injection (DROP, DELETE, UPDATE, ALTER, TRUNCATE — reject)
          2. Missing LIMIT on large result sets — add LIMIT 50
          3. Invalid table/column names
          4. Malformed Cypher syntax
          5. Queries returning >1000 rows without aggregation
          6. File paths outside /opt/mythos/ — reject
          7. State-modifying commands — reject
        condition: always


  # ═══════════════════════════════════════════════════════════════
  # WORKER: IRIS (main response model)
  # ═══════════════════════════════════════════════════════════════

  iris:
    model: "iris-thinking-v2:latest"
    temperature: 0.4
    num_predict: 4096
    timeout: 60

    system_prompt_components:
      - id: "iris_identity"
        order: 1
        source: "file:/opt/mythos/iris/core/iris_identity.md"
        condition: always

      - id: "iris_voice"
        order: 2
        source: "file:/opt/mythos/iris/core/voice.yaml"
        condition: always

      - id: "iris_user_profile"
        order: 3
        source: "file:/opt/mythos/iris/core/users/{speaker}.yaml"
        condition: "speaker_file_exists"

      - id: "iris_response_params"
        order: 10
        text: |
          ## Response Parameters
          Tone: {tone}
          Depth: {depth}
          Speaker: {speaker}
        condition: always

      - id: "iris_context_block"
        order: 20
        text: "{assembled_context}"
        condition: "context_available"
        description: "Injected by orchestrator from DISCOVERY output"

    # Fast-path override: minimal prompt for trivial messages
    fast_path_components:
      - id: "iris_identity"
      - id: "iris_voice"
      - id: "iris_response_params"
      # No context block, no user profile — keep it lean
