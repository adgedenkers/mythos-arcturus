<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Iris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    text-align: center;
    padding: 20px 16px 10px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 8px;
    color: #7eb8da;
  }
  .status {
    font-size: 12px;
    color: #555;
    margin-top: 4px;
    letter-spacing: 2px;
  }
  .status.connected { color: #4a9; }
  .status.error { color: #c55; }
  .transcript-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
  }
  .msg.user {
    align-self: flex-end;
    background: #1a3a4a;
    color: #b0d8ef;
    border-bottom-right-radius: 4px;
  }
  .msg.iris {
    align-self: flex-start;
    background: #1a1a2e;
    color: #d0d0e0;
    border-bottom-left-radius: 4px;
  }
  .controls {
    padding: 16px 20px 32px;
    display: flex;
    justify-content: center;
    gap: 16px;
    align-items: center;
  }
  .mic-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid #333;
    background: #111;
    color: #888;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .mic-btn:active, .mic-btn.recording {
    background: #1a2a3a;
    border-color: #7eb8da;
    color: #7eb8da;
    transform: scale(1.05);
  }
  .mic-btn.recording {
    animation: pulse 1.5s ease-in-out infinite;
  }
  .mic-btn.processing {
    background: #1a1a2e;
    border-color: #556;
    color: #556;
    animation: spin 1s linear infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(126, 184, 218, 0.3); }
    50% { box-shadow: 0 0 0 16px rgba(126, 184, 218, 0); }
  }
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }
  .thinking {
    text-align: center;
    padding: 8px;
    font-size: 13px;
    color: #556;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="header">
  <h1>I R I S</h1>
  <div class="status" id="status">connecting...</div>
</div>
<div class="transcript-area" id="transcript"></div>
<div id="thinking" class="thinking" style="display:none">thinking...</div>
<div class="controls">
  <div class="mic-btn" id="micBtn">&#x1F3A4;</div>
</div>

<script>
const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws/voice`;
const SAMPLE_RATE = 16000;

let ws = null;
let audioCtx = null;
let mediaStream = null;
let recording = false;
let processor = null;
let audioChunks = [];

const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const micBtn = document.getElementById('micBtn');
const thinkingEl = document.getElementById('thinking');

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + (cls || '');
}

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function connect() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    setStatus('connected', 'connected');
  };

  ws.onmessage = (evt) => {
    if (evt.data instanceof ArrayBuffer) {
      // Audio response - play it
      playAudio(evt.data);
      micBtn.classList.remove('processing');
      thinkingEl.style.display = 'none';
    } else {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'transcript') {
        addMsg(msg.text, 'user');
      } else if (msg.type === 'response') {
        addMsg(msg.text, 'iris');
      }
    }
  };

  ws.onclose = () => {
    setStatus('disconnected — tap to reconnect', 'error');
    setTimeout(connect, 3000);
  };

  ws.onerror = () => {
    setStatus('connection error', 'error');
  };
}

async function playAudio(wavBytes) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await audioCtx.decodeAudioData(wavBytes.slice(0));
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start();
  } catch (e) {
    console.error('Playback error:', e);
  }
}

async function startRecording() {
  if (recording) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        sampleRate: SAMPLE_RATE,
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      }
    });

    const source = audioCtx.createMediaStreamSource(mediaStream);

    // Use ScriptProcessorNode for compatibility
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    audioChunks = [];

    processor.onaudioprocess = (e) => {
      if (!recording) return;
      const input = e.inputBuffer.getChannelData(0);
      // Resample to 16kHz if needed
      const ratio = audioCtx.sampleRate / SAMPLE_RATE;
      const resampled = new Float32Array(Math.floor(input.length / ratio));
      for (let i = 0; i < resampled.length; i++) {
        resampled[i] = input[Math.floor(i * ratio)];
      }
      audioChunks.push(new Float32Array(resampled));
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);
    recording = true;
    micBtn.classList.add('recording');
    setStatus('listening...', 'connected');
  } catch (e) {
    console.error('Mic error:', e);
    setStatus('microphone access denied', 'error');
  }
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  micBtn.classList.remove('recording');
  micBtn.classList.add('processing');
  thinkingEl.style.display = 'block';
  setStatus('processing...', 'connected');

  // Stop mic
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  if (processor) {
    processor.disconnect();
    processor = null;
  }

  // Merge chunks and convert to int16
  if (audioChunks.length === 0) {
    micBtn.classList.remove('processing');
    thinkingEl.style.display = 'none';
    setStatus('connected', 'connected');
    return;
  }

  let totalLen = 0;
  audioChunks.forEach(c => totalLen += c.length);
  const merged = new Float32Array(totalLen);
  let offset = 0;
  audioChunks.forEach(c => { merged.set(c, offset); offset += c.length; });
  audioChunks = [];

  // Skip if too short
  if (totalLen < SAMPLE_RATE * 0.5) {
    micBtn.classList.remove('processing');
    thinkingEl.style.display = 'none';
    setStatus('connected', 'connected');
    return;
  }

  // Convert to int16 PCM
  const pcm16 = new Int16Array(merged.length);
  for (let i = 0; i < merged.length; i++) {
    pcm16[i] = Math.max(-32768, Math.min(32767, Math.floor(merged[i] * 32768)));
  }

  // Send to server
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(pcm16.buffer);
    setStatus('thinking...', 'connected');
  } else {
    micBtn.classList.remove('processing');
    thinkingEl.style.display = 'none';
    setStatus('not connected', 'error');
  }
}

// Push-to-talk: hold to record, release to send
micBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopRecording(); });
micBtn.addEventListener('mouseleave', (e) => { if (recording) stopRecording(); });

// Touch events for mobile
micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
micBtn.addEventListener('touchcancel', (e) => { if (recording) stopRecording(); });

// Init
connect();
</script>
</body>
</html>
